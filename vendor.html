<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - Smart Campus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .vendor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            padding: 20px;
            border-left: 4px solid var(--primary-color);
        }

        .stat-title {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 600;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            font-family: inherit;
        }

        .tab-btn.active {
            color: var(--primary-color);
            background-color: rgba(164, 118, 245, 0.1);
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th, .data-table td {
            text-align: left;
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .data-table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
        }

        .data-table tr:hover td {
            background-color: rgba(255,255,255,0.02);
        }

        /* Toggle Switch for Inventory */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #10b981;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Panels */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="dashboard-body">
    <header class="navbar">
        <div class="logo">
            <i data-feather="briefcase" id="role-icon" class="text-primary"></i>
            <span id="role-name">Vendor Dashboard</span>
        </div>
        <div class="user-profile">
            <div style="text-align: right; margin-right: 15px; display: inline-block; vertical-align: middle;">
                <div style="font-weight: 600; font-size: 14px;" id="shop-name">Main Canteen</div>
                <div style="color: #10b981; font-size: 12px;">● Online</div>
            </div>
            <img src="https://ui-avatars.com/api/?name=Merchant&background=2c2c2e&color=fff" alt="Vendor Profile" style="vertical-align: middle;">
        </div>
    </header>

    <main class="container">
        
        <div class="stats-grid">
            <div class="stat-card glass-panel">
                <div class="stat-title">Active Queue</div>
                <div class="stat-value">12</div>
            </div>
            <div class="stat-card glass-panel" style="border-left-color: #10b981;">
                <div class="stat-title">Completed Today</div>
                <div class="stat-value">84</div>
            </div>
            <div class="stat-card glass-panel" style="border-left-color: #fcd34d;">
                <div class="stat-title">Pending Prints</div>
                <div class="stat-value">5</div>
            </div>
        </div>

        <div class="glass-panel" id="main-panel" style="padding: 30px;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'queue')">Active Queue</button>
                <button class="tab-btn" onclick="switchTab(event, 'inventory')" id="inventory-tab-btn">Inventory Management</button>
            </div>

            <!-- Queue Tab -->
            <div id="queue" class="tab-panel active">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Items / Specs</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="queue-body">
                    </tbody>
                </table>
            </div>

            <!-- Inventory Tab -->
            <div id="inventory" class="tab-panel">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Availability</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body">
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        feather.replace();

        const urlParams = new URLSearchParams(window.location.search);
        const vendorType = urlParams.get('type') || 'food';

        // Initialize UI based on type
        function initDashboard() {
            const roleName = document.getElementById('role-name');
            const shopName = document.getElementById('shop-name');
            const invTabBtn = document.getElementById('inventory-tab-btn');
            const queueBody = document.getElementById('queue-body');
            const invBody = document.getElementById('inventory-body');

            if (vendorType === 'xerox') {
                roleName.innerText = 'Xerox Center Admin';
                shopName.innerText = 'Library Xerox';
                invTabBtn.innerText = 'Resource Management';
                
                queueBody.innerHTML = `
                    <tr>
                        <td style="font-weight: 600;">#SC-8922</td>
                        <td>Mike R.</td>
                        <td>Assignment_Final.pdf<br><small style="color:gray">B&W, Double-sided, 12 pg</small></td>
                        <td><span class="status-badge preparing">In Queue</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline"><i data-feather="download" style="width:14px;"></i> Download</button>
                            <button class="btn btn-sm btn-primary">Mark Printed</button>
                        </td>
                    </tr>
                `;

                invBody.innerHTML = `
                    <tr><td>A4 Standard Paper</td><td>Paper</td><td>₹0.10</td><td><label class="toggle-switch"><input type="checkbox" checked><span class="slider"></span></label></td></tr>
                    <tr><td>A3 Large Format</td><td>Paper</td><td>₹0.50</td><td><label class="toggle-switch"><input type="checkbox" checked><span class="slider"></span></label></td></tr>
                    <tr><td>Glossy Photo Paper</td><td>Specialty</td><td>₹2.00</td><td><label class="toggle-switch"><input type="checkbox"><span class="slider"></span></label></td></tr>
                `;
            } else {
                roleName.innerText = 'Restaurant Dashboard';
                shopName.innerText = 'Main Canteen';
                invTabBtn.innerText = 'Menu Availability';

                queueBody.innerHTML = `
                    <tr>
                        <td style="font-weight: 600;">#SC-8924</td>
                        <td>Alex Student</td>
                        <td>1x Classic Cheeseburger<br><small style="color:gray">No onions</small></td>
                        <td><span class="status-badge preparing">New Order</span></td>
                        <td><button class="btn btn-sm btn-primary" onclick="startOrder(this)">Start (10m)</button></td>
                    </tr>
                `;

                invBody.innerHTML = `
                    <tr><td>Classic Cheeseburger</td><td>Meals</td><td>₹4.50</td><td><label class="toggle-switch"><input type="checkbox" checked><span class="slider"></span></label></td></tr>
                    <tr><td>Chicken Nuggets</td><td>Meals</td><td>₹5.00</td><td><label class="toggle-switch"><input type="checkbox" checked><span class="slider"></span></label></td></tr>
                `;
            }
            feather.replace();
        }

        function startOrder(btn) {
            btn.innerHTML = 'Preparing...';
            btn.classList.add('btn-outline');
            btn.classList.remove('btn-primary');
            alert('Incoming Order Alert! Preparation timer started.');
        }

        function switchTab(evt, tabName) {
            const tabPanels = document.getElementsByClassName("tab-panel");
            for (let i = 0; i < tabPanels.length; i++) {
                tabPanels[i].classList.remove("active");
            }
            const tabBtns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabBtns.length; i++) {
                tabBtns[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
