<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Smart Campus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h1>Login</h1>
            <p>Select your role and enter details</p>
        </div>

        <div class="role-selection">
            <div class="role-chip active" data-role="user">
                <i data-feather="user"></i>
                <span>User</span>
            </div>
            <div class="role-chip" data-role="food">
                <i data-feather="coffee"></i>
                <span>Food</span>
            </div>
            <div class="role-chip" data-role="xerox">
                <i data-feather="printer"></i>
                <span>Xerox</span>
            </div>
            <div class="role-chip" data-role="delivery">
                <i data-feather="truck"></i>
                <span>Delivery</span>
            </div>
            <div class="role-chip" data-role="admin">
                <i data-feather="shield"></i>
                <span>Admin</span>
            </div>
        </div>
        
        <form class="login-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" class="toggle-password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye-off">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
            
            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>
            
            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="signup-section">
            <p>Don't have an account?</p>
            <button type="button" class="signup-btn">Sign up</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
