<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Dashboard - Smart Campus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .task-card {
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-left: 4px solid var(--primary-color);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .task-id {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-muted);
        }

        .task-type {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .type-food { background: rgba(245, 118, 118, 0.15); color: #f57676; border: 1px solid rgba(245, 118, 118, 0.3); }
        .type-xerox { background: rgba(118, 186, 245, 0.15); color: #76baf5; border: 1px solid rgba(118, 186, 245, 0.3); }

        .task-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 500;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
        }

        .route-info {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 12px;
            margin-top: 5px;
        }

        .route-path {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .pin-section {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pin-input-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .pin-digit {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .pin-digit:focus {
            border-color: var(--primary-color);
            outline: none;
            background: rgba(255, 255, 255, 0.1);
        }

        .agent-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            padding: 15px;
            text-align: center;
        }

        .stat-num {
            display: block;
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-color);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
    </style>
</head>
<body class="dashboard-body">
    <header class="navbar">
        <div class="logo">
            <i data-feather="truck" class="text-primary"></i>
            <span>Delivery Agent</span>
        </div>
        <div class="user-profile">
            <img src="https://ui-avatars.com/api/?name=Sam+Agent&background=10b981&color=fff" alt="Agent Profile">
        </div>
    </header>

    <main class="container">
        <!-- Broadcast Banner -->
        <div id="system-broadcast" class="glass-panel" style="display: none; padding: 15px 20px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; margin-bottom: 20px; align-items: center; gap: 10px; color: #fff;">
            <i data-feather="bell" style="color: #10b981;"></i>
            <span style="font-weight: 600; margin-right: 5px;">System Update:</span>
            <span id="system-broadcast-text" style="font-size: 14px;"></span>
        </div>

        <!-- Agent Stats -->
        <div class="agent-stats">
            <div class="stat-box glass-panel">
                <span class="stat-num">08</span>
                <span class="stat-label">Tasks Done</span>
            </div>
            <div class="stat-box glass-panel">
                <span class="stat-num">₹145</span>
                <span class="stat-label">Earnings</span>
            </div>
            <div class="stat-box glass-panel">
                <span class="stat-num">4.9</span>
                <span class="stat-label">Rating</span>
            </div>
        </div>

        <h2 class="section-title">Available Tasks</h2>
        
        <div class="task-list" id="delivery-task-list">
            <!-- Dynamic tasks will load here -->
            <div style="text-align: center; color: #a1a1aa; padding: 40px;">Waiting for ready delivery orders...</div>
        </div>
    </main>

    <script type="module">
        import { db, collection, query, where, onSnapshot, doc, updateDoc, auth, getDoc } from './firebase-init.js';
        
        window.feather = feather;
        feather.replace();

        // Listen for system broadcasts
        const broadcastRef = doc(db, 'system', 'config');
        onSnapshot(broadcastRef, (docSnap) => {
            const banner = document.getElementById('system-broadcast');
            const bannerText = document.getElementById('system-broadcast-text');
            if (docSnap.exists() && docSnap.data().broadcastMessage) {
                bannerText.innerText = docSnap.data().broadcastMessage;
                banner.style.display = 'flex';
            } else {
                banner.style.display = 'none';
            }
        });

        let tasksData = {};
        
        // Listen for tasks that are Ready or Out for Delivery
        document.addEventListener('DOMContentLoaded', () => {
            const q = query(collection(db, 'orders'), where('fulfillment', '==', 'delivery'));
            onSnapshot(q, (snapshot) => {
                const taskList = document.getElementById('delivery-task-list');
                let html = '';
                
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    tasksData[docId] = data;
                    
                    // We only want orders that are Ready, or currently being delivered by THIS agent
                    const uid = auth.currentUser ? auth.currentUser.uid : null;
                    if (data.status !== 'Ready' && data.status !== 'Out for Delivery') return;
                    if (data.status === 'Out for Delivery' && data.deliveryAgentId !== uid) return;
                    
                    const isClaimed = data.status === 'Out for Delivery';
                    
                    html += `
                        <div class="task-card glass-panel" id="task-${docId}">
                            <div class="task-header">
                                <span class="task-id">#${data.orderId}</span>
                                <span class="task-type type-${data.type}">${data.type.toUpperCase()} Order</span>
                            </div>
                            <div class="task-info">
                                <div class="info-item">
                                    <span class="info-label">Pickup</span>
                                    <span class="info-value">${data.type === 'food' ? 'Main Canteen' : 'Xerox Center'}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Delivery Earnings</span>
                                    <span class="info-value">₹5.00</span>
                                </div>
                            </div>
                            <div class="route-info">
                                <div class="route-path">
                                    <i data-feather="map-pin" style="width:14px; color: #ef4444;"></i>
                                    <span>${data.location}</span>
                                </div>
                            </div>
                            
                            ${isClaimed 
                                ? `<button class="btn btn-primary" style="background-color: #10b981;" disabled><i data-feather="check"></i> Task Claimed</button>`
                                : `<button class="btn btn-primary" onclick="window.claimTask('${docId}')">Claim Task</button>`
                            }
                            
                            <div class="pin-section" id="pin-${docId}" style="display: ${isClaimed ? 'block' : 'none'};">
                                <span class="info-label">Enter User 4-Digit PIN to complete delivery</span>
                                <div class="pin-input-group">
                                    <input type="text" maxlength="1" class="pin-digit pin-${docId}-0">
                                    <input type="text" maxlength="1" class="pin-digit pin-${docId}-1">
                                    <input type="text" maxlength="1" class="pin-digit pin-${docId}-2">
                                    <input type="text" maxlength="1" class="pin-digit pin-${docId}-3">
                                </div>
                                <button class="btn btn-secondary" style="margin-top: 15px; width: 100%;" onclick="window.verifyCompletion('${docId}')">Verify PIN & Complete Task</button>
                            </div>
                        </div>
                    `;
                });
                
                if (html) {
                    taskList.innerHTML = html;
                    feather.replace();
                    setupPinInputs();
                } else {
                    taskList.innerHTML = '<div style="text-align: center; color: #a1a1aa; padding: 40px;">No delivery tasks available.</div>';
                }
            });
        });

        window.claimTask = async function(id) {
            if (!auth.currentUser) {
                if (window.showToast) window.showToast('You must be logged in as an agent to claim tasks.', 'error');
                return;
            }
            try {
                await updateDoc(doc(db, 'orders', id), {
                    status: 'Out for Delivery',
                    deliveryAgentId: auth.currentUser.uid,
                    deliveryAgentName: auth.currentUser.displayName || 'Delivery Agent'
                });
                if (window.showToast) window.showToast('Task Claimed Successfully!', 'success');
            } catch(e) {
                console.error("Error claiming task:", e);
                if (window.showToast) window.showToast('Failed to claim task.', 'error');
            }
        };

        window.verifyCompletion = async function(id) {
            const p0 = document.querySelector(`.pin-${id}-0`).value;
            const p1 = document.querySelector(`.pin-${id}-1`).value;
            const p2 = document.querySelector(`.pin-${id}-2`).value;
            const p3 = document.querySelector(`.pin-${id}-3`).value;
            const enteredPin = p0 + p1 + p2 + p3;
            
            try {
                const docSnap = await getDoc(doc(db, 'orders', id));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.pin == enteredPin || data.pin === undefined) {
                        await updateDoc(doc(db, 'orders', id), {
                            status: 'Completed'
                        });
                        if (window.showToast) window.showToast(`Task ${id} Completed successfully!`, 'success');
                    } else {
                        if (window.showToast) window.showToast('Incorrect PIN. Please try again.', 'error');
                    }
                }
            } catch(e) {
                console.error("Error verifying PIN:", e);
            }
        };

        function setupPinInputs() {
            document.querySelectorAll('.pin-digit').forEach((input, idx, inputs) => {
                input.addEventListener('input', () => {
                    if (input.value.length === 1 && idx < inputs.length - 1) {
                        // find next sibling or next input in group
                        const parent = input.parentElement;
                        const siblings = parent.querySelectorAll('.pin-digit');
                        const myIdx = Array.from(siblings).indexOf(input);
                        if (myIdx < siblings.length - 1) siblings[myIdx + 1].focus();
                    }
                });
            });
        }
    </script>
    <script type="module" src="script.js"></script>
    <script type="module" src="home.js"></script>
</body>
</html>
