<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - Smart Campus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        /* Modern Mobile & Desktop Responsive Vendor Layout */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            padding: 14px 16px;
            border-left: 3px solid var(--primary-color);
            background: rgba(30, 30, 36, 0.7);
            border-radius: 12px;
        }

        .stat-title {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
        }

        /* Modern Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
            font-family: inherit;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: #fff;
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 4px 12px rgba(164, 118, 245, 0.25);
        }

        /* Responsive Table */
        .table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table th, .data-table td {
            text-align: left;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
        }

        .data-table th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
        }

        .data-table tr:hover td {
            background-color: rgba(255,255,255,0.02);
        }

        /* Toggle Switch for Inventory */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .toggle-switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #10b981;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        /* Panels */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.25s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .stat-card {
                padding: 10px 12px;
            }
            .stat-title {
                font-size: 9px;
            }
            .stat-value {
                font-size: 18px;
            }
            .navbar .user-profile div span, 
            .navbar .user-profile div div {
                font-size: 11px !important;
            }
            #main-panel {
                padding: 16px !important;
            }
        }
    </style>
</head>
<body class="dashboard-body">
    <header class="navbar">
        <div class="logo">
            <i data-feather="briefcase" id="role-icon" class="text-primary"></i>
            <span id="role-name" style="font-size: 15px; font-weight: 700;">Dashboard</span>
        </div>
        <div class="user-profile" style="display: flex; align-items: center; gap: 8px;">
            <div style="text-align: right; line-height: 1.2;">
                <div style="font-weight: 600; font-size: 13px; color: #fff; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" id="shop-name">Main Canteen</div>
                <div style="color: #10b981; font-size: 10px; font-weight: 600;">● Online</div>
            </div>
            <img src="https://ui-avatars.com/api/?name=Merchant&background=2c2c2e&color=fff" alt="Vendor Profile" style="width: 32px; height: 32px; border-radius: 50%;">
        </div>
    </header>

    <main class="container">
        <!-- Broadcast Banner -->
        <div id="system-broadcast" class="glass-panel" style="display: none; padding: 12px 16px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; margin-bottom: 16px; align-items: center; gap: 10px; color: #fff;">
            <i data-feather="bell" style="color: #10b981; width: 16px; height: 16px;"></i>
            <span style="font-weight: 600; font-size: 13px; margin-right: 5px;">Update:</span>
            <span id="system-broadcast-text" style="font-size: 13px;"></span>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card glass-panel">
                <div class="stat-title">Active</div>
                <div class="stat-value" id="stat-active-queue">0</div>
            </div>
            <div class="stat-card glass-panel" style="border-left-color: #10b981;">
                <div class="stat-title">Done</div>
                <div class="stat-value" id="stat-completed-today">0</div>
            </div>
            <div class="stat-card glass-panel" style="border-left-color: #fcd34d;">
                <div class="stat-title" id="stat-pending-label">Items</div>
                <div class="stat-value" id="stat-pending-items">0</div>
            </div>
        </div>

        <div class="glass-panel" id="main-panel" style="padding: 20px; border-radius: 14px;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'queue')">Active Queue</button>
                <button class="tab-btn" onclick="switchTab(event, 'inventory')" id="inventory-tab-btn">Inventory Management</button>
            </div>

            <!-- Queue Tab -->
            <div id="queue" class="tab-panel active">
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items / Specs</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="queue-body">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Inventory Tab -->
            <div id="inventory" class="tab-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin:0; font-weight: 600; font-size: 15px;">Manage Items</h3>
                    <button class="btn btn-sm btn-primary" onclick="document.getElementById('add-item-modal').style.display='flex'">
                        <i data-feather="plus" style="width: 14px; height: 14px;"></i> Add Item
                    </button>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Availability</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Add Item Modal -->
        <div id="add-item-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
            <div class="glass-panel" style="width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; position: relative;">
                <h2 style="margin-top: 0; margin-bottom: 20px;">Add New Item</h2>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #a1a1aa;">Item Name</label>
                    <input type="text" id="new-item-name" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff;" placeholder="e.g. French Fries">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #a1a1aa;">Category</label>
                    <select id="new-item-cat" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff; appearance: auto; -webkit-appearance: auto;">
                    </select>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #a1a1aa;">Price (₹)</label>
                    <input type="number" id="new-item-price" step="0.10" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff;" placeholder="e.g. 2.50">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #a1a1aa;">Image (Optional)</label>
                    <input type="file" id="new-item-image" accept="image/*" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff; cursor: pointer;">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('add-item-modal').style.display='none'">Cancel</button>
                    <button class="btn btn-primary" style="flex: 1;" onclick="window.saveNewItem()">Save Item</button>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { auth, db, collection, query, where, onSnapshot, updateDoc, deleteDoc, doc, addDoc, getDoc } from "./firebase-init.js";
        
        window.feather = feather;
        feather.replace();

        const urlParams = new URLSearchParams(window.location.search);
        const vendorType = urlParams.get('type') || 'food';
        let currentVendor = null;

        // Initialize UI based on type and logged in vendor
        window.initDashboard = function(user) {
            currentVendor = user;
            const roleName = document.getElementById('role-name');
            const shopName = document.getElementById('shop-name');
            const invTabBtn = document.getElementById('inventory-tab-btn');
            const statPendingLabel = document.getElementById('stat-pending-label');

            if (user && user.displayName) {
                shopName.innerText = user.displayName;
            }

            if (vendorType === 'xerox') {
                roleName.innerText = 'Xerox & Print Manager';
                if (!user || !user.displayName) shopName.innerText = 'Campus Xerox Point';
                invTabBtn.innerText = 'Print & Paper Rates';
                if (statPendingLabel) statPendingLabel.innerText = 'Print Options';

                const catSelect = document.getElementById('new-item-cat');
                catSelect.innerHTML = `
                    <option value="Paper">Paper</option>
                    <option value="Specialty">Specialty</option>
                    <option value="Binding">Binding</option>
                    <option value="Stationery">Stationery</option>
                `;
            } else {
                roleName.innerText = 'Restaurant Dashboard';
                if (!user || !user.displayName) shopName.innerText = 'Restaurant / Canteen';
                invTabBtn.innerText = 'Menu Availability';
                if (statPendingLabel) statPendingLabel.innerText = 'Menu Items';

                const catSelect = document.getElementById('new-item-cat');
                catSelect.innerHTML = `
                    <option value="popular">Popular</option>
                    <option value="beverages">Beverages</option>
                    <option value="meals">Meals</option>
                    <option value="snacks">Snacks</option>
                    <option value="breakfast">Breakfast</option>
                `;
            }
            
            window.listenVendorOrders(user);
            window.listenInventory(user);
            if (typeof feather !== 'undefined') feather.replace();
        };

        window.listenVendorOrders = function(user) {
            const queueBody = document.getElementById('queue-body');
            const statActive = document.getElementById('stat-active-queue');
            const statCompleted = document.getElementById('stat-completed-today');
            
            const q = query(collection(db, 'orders'), where('type', '==', vendorType));
            
            onSnapshot(q, (snapshot) => {
                queueBody.innerHTML = '';
                let activeCount = 0;
                let completedCount = 0;

                if (snapshot.empty) {
                    queueBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#a1a1aa; padding: 30px;">No active orders in queue.</td></tr>';
                    if (statActive) statActive.innerText = '0';
                    if (statCompleted) statCompleted.innerText = '0';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const order = docSnap.data();
                    const docId = docSnap.id;
                    window.cachedOrders = window.cachedOrders || {};
                    window.cachedOrders[docId] = order;
                    const s = (order.status || 'Requested').toLowerCase();
                    const isDelivery = order.fulfillment === 'delivery';
                    
                    // Filter orders for specific restaurant if food, but shared for Xerox
                    if (vendorType !== 'xerox' && user && order.vendorId && order.vendorId !== user.uid) {
                        return;
                    }

                    if (s === 'completed' || s === 'delivered') {
                        completedCount++;
                        return;
                    }

                    activeCount++;
                    let statusBadgeClass = 'preparing';
                    if (s === 'ready' || s === 'ready for pickup' || s === 'accepted') statusBadgeClass = 'ready';
                    else if (s === 'out for delivery') statusBadgeClass = 'ready';
                    
                    let actionDropdown = '';
                    if (vendorType === 'xerox') {
                        actionDropdown = `
                            <button class="btn btn-sm btn-outline" style="margin-right: 5px; display: inline-flex; align-items: center; gap: 4px;" onclick="window.downloadXeroxDocument('${docId}')" title="Download Document for Printing">
                                <i data-feather="download" style="width:14px; height:14px;"></i> Download
                            </button>
                            <select class="btn btn-sm btn-primary" style="padding: 5px 30px 5px 15px; appearance: auto; -webkit-appearance: auto; cursor: pointer;" onchange="updateOrderStatus(this, '${docId}', ${isDelivery})">
                                <option value="" disabled selected>Update Status...</option>
                                <option value="Printing">Printing</option>
                                <option value="Ready">Mark Ready ${isDelivery ? '(Notify Delivery Agent)' : '(Notify Student)'}</option>
                                ${!isDelivery ? '<option value="Completed">Handover to Student (Complete)</option>' : ''}
                            </select>
                        `;
                    } else {
                        actionDropdown = `
                            <select class="btn btn-sm btn-primary" style="padding: 5px 30px 5px 15px; appearance: auto; -webkit-appearance: auto; cursor: pointer;" onchange="updateOrderStatus(this, '${docId}', ${isDelivery})">
                                <option value="" disabled selected>Update Status...</option>
                                <option value="Accepted">Accept Order</option>
                                <option value="Preparing">Preparing</option>
                                <option value="Ready">Mark Ready ${isDelivery ? '(Notify Delivery Agent)' : '(Notify Student)'}</option>
                                ${!isDelivery ? '<option value="Completed">Handover to Student (Complete)</option>' : ''}
                            </select>
                        `;
                    }

                    const fulfillmentBadge = isDelivery
                        ? `<span style="display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 6px; border-radius:4px; background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.3); font-weight:600;"><i data-feather="truck" style="width:11px; height:11px;"></i> Delivery (${order.location || 'Campus'})</span>`
                        : `<span style="display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 6px; border-radius:4px; background:rgba(164,118,245,0.15); color:var(--primary-color); border:1px solid rgba(164,118,245,0.3); font-weight:600;"><i data-feather="user" style="width:11px; height:11px;"></i> Counter Pickup</span>`;

                    queueBody.innerHTML += `
                        <tr>
                            <td style="font-weight: 600;">
                                #${order.orderId || docId.substring(0,6)}
                                <div style="margin-top: 4px;">${fulfillmentBadge}</div>
                            </td>
                            <td>${order.userName || 'Student'}</td>
                            <td>${order.items || 'Standard Order'}</td>
                            <td><span class="status-badge ${statusBadgeClass}">${order.status || 'Requested'}</span></td>
                            <td>${actionDropdown}</td>
                        </tr>
                    `;
                });

                if (activeCount === 0) {
                    queueBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#a1a1aa; padding: 30px;">No active orders in queue.</td></tr>';
                }

                if (statActive) statActive.innerText = activeCount.toString();
                if (statCompleted) statCompleted.innerText = completedCount.toString();
                if (typeof feather !== 'undefined') feather.replace();
            });
        };

        function sanitizePdfText(str) {
            return String(str || '')
                .replace(/\\/g, '/')
                .replace(/\(/g, '[')
                .replace(/\)/g, ']')
                .replace(/[^\x20-\x7E]/g, ' ');
        }

        function generatePrintablePdfBlob(order, fileName) {
            const orderId = sanitizePdfText(order.orderId || 'SC-0000');
            const student = sanitizePdfText(order.userName || 'Alex Student');
            const items = sanitizePdfText(order.items || 'Standard Document Printing');
            const location = sanitizePdfText(order.location || 'Counter Pickup');
            const fulfillment = sanitizePdfText((order.fulfillment || 'pickup').toUpperCase());
            const pin = sanitizePdfText(order.pin || '4921');
            const dateStr = sanitizePdfText(order.createdAt ? new Date(order.createdAt).toLocaleString() : new Date().toLocaleString());
            const cleanDocName = sanitizePdfText(fileName);

            const stream = [
                'BT',
                '/F1 18 Tf',
                '50 740 Td',
                '(SMART CAMPUS PRINTING SERVICE - JOB TICKET & FILE) Tj',
                '/F1 11 Tf',
                '0 -24 Td',
                '(Central Library Xerox & Document Center | Order #' + orderId + ') Tj',
                '0 -20 Td',
                '(Student: ' + student + '  |  Pickup PIN: ' + pin + '  |  Payment: PAID) Tj',
                '0 -20 Td',
                '(Date & Time: ' + dateStr + ') Tj',
                '0 -20 Td',
                '(File Name: ' + cleanDocName + ') Tj',
                '0 -20 Td',
                '(Print Specifications: ' + items + ') Tj',
                '0 -20 Td',
                '(Fulfillment: ' + fulfillment + ' - ' + location + ') Tj',
                '0 -35 Td',
                '/F1 14 Tf',
                '(DOCUMENT BODY & VERIFIED PRINT PAYLOAD) Tj',
                '/F1 10 Tf',
                '0 -20 Td',
                '(--------------------------------------------------------------------------------------------------) Tj',
                '0 -18 Td',
                '(Project Title: Smart Campus Services - Decentralized Queue Reduction Platform) Tj',
                '0 -16 Td',
                '(Author / Submitter: ' + student + ' [Campus ID / Verified Student Alex]) Tj',
                '0 -16 Td',
                '(Abstract / Content: This document was submitted through the Smart Campus Xerox Kiosk.) Tj',
                '0 -16 Td',
                '(All page calculations, duplex configurations, and binding options have been validated.) Tj',
                '0 -16 Td',
                '(Printing instructions: Please feed standard A4 paper. Check duplex alignment.) Tj',
                '0 -16 Td',
                '(Upon completion, place in collection bin #' + pin.slice(-2) + ' and mark Ready in Vendor Terminal.) Tj',
                '0 -22 Td',
                '(--------------------------------------------------------------------------------------------------) Tj',
                '0 -25 Td',
                '/F1 9 Tf',
                '(Official Campus Xerox Verification Seal - Encrypted Job ID: ' + orderId + ' - Verified) Tj',
                'ET'
            ].join('\n');

            const len = stream.length;
            const body = 
'%PDF-1.4\n' +
'1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n' +
'2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n' +
'3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>\nendobj\n' +
'4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n' +
'5 0 obj\n<< /Length ' + len + ' >>\nstream\n' + stream + '\nendstream\nendobj\n';

            const p1 = body.indexOf('1 0 obj');
            const p2 = body.indexOf('2 0 obj');
            const p3 = body.indexOf('3 0 obj');
            const p4 = body.indexOf('4 0 obj');
            const p5 = body.indexOf('5 0 obj');
            const xrefOffset = body.length;

            const pad = (n) => String(n).padStart(10, '0');
            const xref = 'xref\n0 6\n' +
                         '0000000000 65535 f \n' +
                         pad(p1) + ' 00000 n \n' +
                         pad(p2) + ' 00000 n \n' +
                         pad(p3) + ' 00000 n \n' +
                         pad(p4) + ' 00000 n \n' +
                         pad(p5) + ' 00000 n \n' +
                         'trailer\n<< /Size 6 /Root 1 0 R >>\n' +
                         'startxref\n' + xrefOffset + '\n%%EOF';

            return new Blob([body + xref], { type: 'application/pdf' });
        }

        window.downloadXeroxDocument = function(docId) {
            const order = (window.cachedOrders && window.cachedOrders[docId]) || {};
            const orderId = order.orderId || docId.substring(0, 6);
            
            // Extract filename
            let fileName = order.fileName;
            if (!fileName) {
                const match = (order.items || '').match(/([a-zA-Z0-9_\-\.\s]+\.(pdf|docx|doc|txt|png|jpg))/i);
                fileName = match ? match[1].trim() : `Document_${orderId}.pdf`;
            }
            if (!fileName.includes('.')) fileName += '.pdf';

            // Check if uploaded fileData exists in order or localStorage
            let fileData = order.fileData ||
                           localStorage.getItem('xerox_file_' + orderId) ||
                           localStorage.getItem('xerox_file_' + docId) ||
                           localStorage.getItem('xerox_cached_' + fileName);

            if (fileData && fileData.startsWith('data:')) {
                const a = document.createElement('a');
                a.href = fileData;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                if (window.showToast) window.showToast(`Downloaded ${fileName}`, 'success');
                else alert(`Downloaded ${fileName}`);
                return;
            }

            // Generate verified valid PDF blob on-the-fly
            const pdfBlob = generatePrintablePdfBlob(order, fileName);
            const downloadUrl = URL.createObjectURL(pdfBlob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = fileName.endsWith('.pdf') ? fileName : fileName + '.pdf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 8000);

            if (window.showToast) window.showToast(`Downloaded printable ${fileName}`, 'success');
            else alert(`Downloaded printable ${fileName}`);
        };

        window.updateOrderStatus = async function(selectEl, docId, isDelivery = false) {
            const val = selectEl.value;
            if (!val) return;
            
            try {
                if (val === 'Completed') {
                    await updateDoc(doc(db, 'orders', docId), { status: 'Completed', completedAt: new Date().toISOString() });
                    if (window.showToast) window.showToast('Order Completed!', 'success');
                } else {
                    await updateDoc(doc(db, 'orders', docId), { status: val });
                    if (window.showToast) window.showToast(`Order status updated to ${val}`, 'success');
                }
            } catch (err) {
                console.error("Error updating order: ", err);
            }
        };

        window.listenInventory = function(user) {
            const invBody = document.getElementById('inventory-body');
            const statItems = document.getElementById('stat-pending-items');
            
            // Xerox is shared across the campus; Food/Hotels are separated per restaurant
            let q;
            if (vendorType === 'xerox') {
                q = query(collection(db, 'menu_items'), where('vendorType', '==', 'xerox'));
            } else if (user && user.uid) {
                q = query(collection(db, 'menu_items'), where('vendorId', '==', user.uid));
            } else {
                q = query(collection(db, 'menu_items'), where('vendorType', '==', 'food'));
            }
            
            onSnapshot(q, (snapshot) => {
                invBody.innerHTML = '';
                if (statItems) statItems.innerText = snapshot.size.toString();
                if (snapshot.empty) {
                    invBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#a1a1aa; padding: 30px;">No items added to your menu yet. Click "Add New Item" to create your menu.</td></tr>';
                    return;
                }
                
                snapshot.forEach(docSnap => {
                    const item = docSnap.data();
                    const docId = docSnap.id;
                    const checkedStr = item.available !== false ? 'checked' : '';
                    
                    invBody.innerHTML += `
                        <tr>
                            <td style="font-weight: 500;">${item.name}</td>
                            <td><span style="background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; font-size: 12px;">${item.category}</span></td>
                            <td style="color: var(--primary-color); font-weight: 600;">₹${parseFloat(item.price).toFixed(2)}</td>
                            <td>
                                <label class="toggle-switch">
                                    <input type="checkbox" onchange="window.toggleAvailability('${docId}', this.checked)" ${checkedStr}>
                                    <span class="slider"></span>
                                </label>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline" style="border-color: rgba(239, 68, 68, 0.4); color: #ef4444; padding: 4px 8px;" onclick="window.deleteMenuItem('${docId}')">
                                    <i data-feather="trash-2" style="width: 14px; height: 14px;"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                if (typeof feather !== 'undefined') feather.replace();
            });
        };

        window.deleteMenuItem = async function(docId) {
            try {
                await deleteDoc(doc(db, 'menu_items', docId));
                if (window.showToast) window.showToast('Item deleted from your menu.', 'info');
            } catch (e) {
                console.error("Error deleting item:", e);
            }
        };

        window.toggleAvailability = async function(docId, isAvailable) {
            try {
                await updateDoc(doc(db, 'menu_items', docId), { available: isAvailable });
                if (window.showToast) window.showToast(`Item availability updated.`, 'info');
            } catch (e) {
                console.error("Error updating availability", e);
            }
        };

        window.saveNewItem = async function() {
            const nameEl = document.getElementById('new-item-name');
            const catEl = document.getElementById('new-item-cat');
            const priceEl = document.getElementById('new-item-price');
            const imageEl = document.getElementById('new-item-image');
            
            const name = nameEl.value.trim();
            const category = catEl.value.trim() || 'General';
            const price = parseFloat(priceEl.value);
            
            if (!name || isNaN(price)) {
                if (window.showToast) window.showToast('Please provide a valid name and price.', 'error');
                return;
            }

            // Handle image upload and resize
            let base64Image = null;
            if (imageEl && imageEl.files && imageEl.files[0]) {
                try {
                    base64Image = await new Promise((resolve, reject) => {
                        const file = imageEl.files[0];
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = (e) => {
                            const img = new Image();
                            img.src = e.target.result;
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 400; // Small size for Firestore
                                const scaleSize = MAX_WIDTH / img.width;
                                canvas.width = MAX_WIDTH;
                                canvas.height = img.height * scaleSize;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                resolve(canvas.toDataURL('image/jpeg', 0.8));
                            };
                            img.onerror = (err) => reject(err);
                        };
                        reader.onerror = (err) => reject(err);
                    });
                } catch (e) {
                    console.error("Image processing error", e);
                    if (window.showToast) window.showToast('Error processing image.', 'error');
                    return;
                }
            }
            
            try {
                const user = auth.currentUser;
                const vName = (user && (user.displayName || user.email.split('@')[0])) || (vendorType === 'xerox' ? 'Campus Xerox Point' : 'Campus Canteen');
                const vId = user ? user.uid : 'default';
                const vEmail = user ? user.email : '';

                const itemData = {
                    vendorId: vId,
                    vendorName: vName,
                    vendorEmail: vEmail,
                    vendorType: vendorType,
                    name: name,
                    category: category,
                    price: price,
                    available: true,
                    createdAt: Date.now()
                };
                if (base64Image) {
                    itemData.image = base64Image;
                }
                
                await addDoc(collection(db, 'menu_items'), itemData);
                
                if (window.showToast) window.showToast('New item added to your menu!', 'success');
                document.getElementById('add-item-modal').style.display = 'none';
                nameEl.value = '';
                priceEl.value = '';
                if (imageEl) imageEl.value = '';
            } catch (e) {
                console.error("Error adding item", e);
                if (window.showToast) window.showToast('Failed to add item.', 'error');
            }
        };

        window.switchTab = function(evt, tabName) {
            const tabPanels = document.getElementsByClassName("tab-panel");
            for (let i = 0; i < tabPanels.length; i++) {
                tabPanels[i].classList.remove("active");
            }
            const tabBtns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabBtns.length; i++) {
                tabBtns[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        };

        // Listen for Auth state
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const uSnap = await getDoc(doc(db, 'users', user.uid));
                    if (uSnap.exists()) {
                        const uData = uSnap.data();
                        if (uData.displayName) user.displayName = uData.displayName;
                    }
                } catch(e) {}
                window.initDashboard(user);
            } else {
                window.initDashboard(null);
            }
        });
    </script>
    <script type="module">
        import { db, doc, onSnapshot } from './firebase-init.js';
        
        // Listen for system broadcasts
        const broadcastRef = doc(db, 'system', 'config');
        onSnapshot(broadcastRef, (docSnap) => {
            const banner = document.getElementById('system-broadcast');
            const bannerText = document.getElementById('system-broadcast-text');
            if (docSnap.exists() && docSnap.data().broadcastMessage) {
                bannerText.innerText = docSnap.data().broadcastMessage;
                banner.style.display = 'flex';
            } else {
                banner.style.display = 'none';
            }
        });
    </script>
    <script type="module" src="home.js"></script>
</body>
</html>
