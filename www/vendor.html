<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - Smart Campus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
        .vendor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            padding: 20px;
            border-left: 4px solid var(--primary-color);
        }

        .stat-title {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 600;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            font-family: inherit;
        }

        .tab-btn.active {
            color: var(--primary-color);
            background-color: rgba(164, 118, 245, 0.1);
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th, .data-table td {
            text-align: left;
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .data-table th {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 14px;
        }

        .data-table tr:hover td {
            background-color: rgba(255,255,255,0.02);
        }

        /* Toggle Switch for Inventory */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #10b981;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Panels */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="dashboard-body">
    <header class="navbar">
        <div class="logo">
            <i data-feather="briefcase" id="role-icon" class="text-primary"></i>
            <span id="role-name">Vendor Dashboard</span>
        </div>
        <div class="user-profile">
            <div style="text-align: right; margin-right: 15px; display: inline-block; vertical-align: middle;">
                <div style="font-weight: 600; font-size: 14px;" id="shop-name">Main Canteen</div>
                <div style="color: #10b981; font-size: 12px;">● Online</div>
            </div>
            <img src="https://ui-avatars.com/api/?name=Merchant&background=2c2c2e&color=fff" alt="Vendor Profile" style="vertical-align: middle;">
        </div>
    </header>

    <main class="container">
        <!-- Broadcast Banner -->
        <div id="system-broadcast" class="glass-panel" style="display: none; padding: 15px 20px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; margin-bottom: 20px; align-items: center; gap: 10px; color: #fff;">
            <i data-feather="bell" style="color: #10b981;"></i>
            <span style="font-weight: 600; margin-right: 5px;">System Update:</span>
            <span id="system-broadcast-text" style="font-size: 14px;"></span>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card glass-panel">
                <div class="stat-title">Active Queue</div>
                <div class="stat-value">12</div>
            </div>
            <div class="stat-card glass-panel" style="border-left-color: #10b981;">
                <div class="stat-title">Completed Today</div>
                <div class="stat-value">84</div>
            </div>
            <div class="stat-card glass-panel" style="border-left-color: #fcd34d;">
                <div class="stat-title">Pending Prints</div>
                <div class="stat-value">5</div>
            </div>
        </div>

        <div class="glass-panel" id="main-panel" style="padding: 30px;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'queue')">Active Queue</button>
                <button class="tab-btn" onclick="switchTab(event, 'inventory')" id="inventory-tab-btn">Inventory Management</button>
            </div>

            <!-- Queue Tab -->
            <div id="queue" class="tab-panel active">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Items / Specs</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="queue-body">
                    </tbody>
                </table>
            </div>

            <!-- Inventory Tab -->
            <div id="inventory" class="tab-panel">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 style="margin:0; font-weight: 500;">Manage Items</h3>
                    <button class="btn btn-sm btn-primary" onclick="document.getElementById('add-item-modal').style.display='flex'">
                        <i data-feather="plus" style="width: 14px;"></i> Add New Item
                    </button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Availability</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-body">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add Item Modal -->
        <div id="add-item-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
            <div class="glass-panel" style="width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; position: relative;">
                <h2 style="margin-top: 0; margin-bottom: 20px;">Add New Item</h2>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #a1a1aa;">Item Name</label>
                    <input type="text" id="new-item-name" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff;" placeholder="e.g. French Fries">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #a1a1aa;">Category</label>
                    <select id="new-item-cat" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff; appearance: auto; -webkit-appearance: auto;">
                    </select>
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #a1a1aa;">Price (₹)</label>
                    <input type="number" id="new-item-price" step="0.10" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff;" placeholder="e.g. 2.50">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #a1a1aa;">Image (Optional)</label>
                    <input type="file" id="new-item-image" accept="image/*" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: #fff; cursor: pointer;">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-outline" style="flex: 1;" onclick="document.getElementById('add-item-modal').style.display='none'">Cancel</button>
                    <button class="btn btn-primary" style="flex: 1;" onclick="window.saveNewItem()">Save Item</button>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { auth, db, collection, query, where, onSnapshot, updateDoc, deleteDoc, doc, addDoc } from "./firebase-init.js";
        
        window.feather = feather;
        feather.replace();

        const urlParams = new URLSearchParams(window.location.search);
        const vendorType = urlParams.get('type') || 'food';

        // Initialize UI based on type
        window.initDashboard = function() {
            const roleName = document.getElementById('role-name');
            const shopName = document.getElementById('shop-name');
            const invTabBtn = document.getElementById('inventory-tab-btn');
            const queueBody = document.getElementById('queue-body');
            const invBody = document.getElementById('inventory-body');

            if (vendorType === 'xerox') {
                roleName.innerText = 'Xerox Center Admin';
                shopName.innerText = 'Library Xerox';
                invTabBtn.innerText = 'Resource Management';
                
                const catSelect = document.getElementById('new-item-cat');
                catSelect.innerHTML = `
                    <option value="Paper">Paper</option>
                    <option value="Specialty">Specialty</option>
                    <option value="Binding">Binding</option>
                    <option value="Stationery">Stationery</option>
                `;
            } else {
                roleName.innerText = 'Restaurant Dashboard';
                shopName.innerText = 'Main Canteen';
                invTabBtn.innerText = 'Menu Availability';

                const catSelect = document.getElementById('new-item-cat');
                catSelect.innerHTML = `
                    <option value="popular">Popular</option>
                    <option value="beverages">Beverages</option>
                    <option value="meals">Meals</option>
                    <option value="snacks">Snacks</option>
                    <option value="breakfast">Breakfast</option>
                `;
            }
            
            window.listenVendorOrders();
            window.listenInventory();
            if (typeof feather !== 'undefined') feather.replace();
        };

        window.listenVendorOrders = function() {
            const queueBody = document.getElementById('queue-body');
            const q = query(collection(db, 'orders'), where('type', '==', vendorType));
            
            onSnapshot(q, (snapshot) => {
                queueBody.innerHTML = '';
                
                if (snapshot.empty) {
                    queueBody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#a1a1aa; padding: 30px;">No active orders in queue.</td></tr>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const order = docSnap.data();
                    const docId = docSnap.id;
                    
                    let statusBadgeClass = 'preparing';
                    const s = order.status.toLowerCase();
                    if (s === 'ready' || s === 'ready for pickup' || s === 'accepted') statusBadgeClass = 'ready';
                    if (s === 'completed') statusBadgeClass = 'ready';
                    
                    let actionDropdown = '';
                    if (vendorType === 'xerox') {
                        actionDropdown = `
                            <button class="btn btn-sm btn-outline" style="margin-right: 5px;"><i data-feather="download" style="width:14px;"></i> File</button>
                            <select class="btn btn-sm btn-primary" style="padding: 5px 30px 5px 15px; appearance: auto; -webkit-appearance: auto; cursor: pointer;" onchange="updateOrderStatus(this, '${docId}')">
                                <option value="" disabled selected>Action...</option>
                                <option value="Printing">Start Printing</option>
                                <option value="Ready for Pickup">Mark Printed</option>
                                <option value="Completed">Complete Order</option>
                            </select>
                        `;
                    } else {
                        actionDropdown = `
                            <select class="btn btn-sm btn-primary" style="padding: 5px 30px 5px 15px; appearance: auto; -webkit-appearance: auto; cursor: pointer;" onchange="updateOrderStatus(this, '${docId}')">
                                <option value="" disabled selected>Action...</option>
                                <option value="Accepted">Accept Order</option>
                                <option value="Preparing">Mark Preparing</option>
                                <option value="Ready">Mark Ready</option>
                                <option value="Completed">Complete Order</option>
                            </select>
                        `;
                    }

                    queueBody.innerHTML += `
                        <tr>
                            <td style="font-weight: 600;">#${order.orderId}</td>
                            <td>${order.userName || 'Student'}</td>
                            <td>${order.items}</td>
                            <td><span class="status-badge ${statusBadgeClass}">${order.status}</span></td>
                            <td>${actionDropdown}</td>
                        </tr>
                    `;
                });
                if (typeof feather !== 'undefined') feather.replace();
            });
        };

        window.updateOrderStatus = async function(selectEl, docId) {
            const val = selectEl.value;
            if (!val) return;
            
            try {
                if (val === 'Completed') {
                    await deleteDoc(doc(db, 'orders', docId));
                    if (window.showToast) window.showToast('Order Completed & removed from queue!', 'success');
                } else {
                    await updateDoc(doc(db, 'orders', docId), { status: val });
                    if (window.showToast) window.showToast(`Order status updated to ${val}`, 'success');
                }
            } catch (err) {
                console.error("Error updating order: ", err);
            }
        };

        window.listenInventory = function() {
            const invBody = document.getElementById('inventory-body');
            const q = query(collection(db, 'menu_items'), where('vendorType', '==', vendorType));
            
            onSnapshot(q, (snapshot) => {
                invBody.innerHTML = '';
                if (snapshot.empty) {
                    invBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#a1a1aa; padding: 20px;">No items added yet.</td></tr>';
                    return;
                }
                
                snapshot.forEach(docSnap => {
                    const item = docSnap.data();
                    const docId = docSnap.id;
                    const checkedStr = item.available !== false ? 'checked' : '';
                    
                    invBody.innerHTML += `
                        <tr>
                            <td>${item.name}</td>
                            <td>${item.category}</td>
                            <td>₹${parseFloat(item.price).toFixed(2)}</td>
                            <td>
                                <label class="toggle-switch">
                                    <input type="checkbox" onchange="window.toggleAvailability('${docId}', this.checked)" ${checkedStr}>
                                    <span class="slider"></span>
                                </label>
                            </td>
                        </tr>
                    `;
                });
            });
        };

        window.toggleAvailability = async function(docId, isAvailable) {
            try {
                await updateDoc(doc(db, 'menu_items', docId), { available: isAvailable });
                if (window.showToast) window.showToast(`Item availability updated.`, 'info');
            } catch (e) {
                console.error("Error updating availability", e);
            }
        };

        window.saveNewItem = async function() {
            const nameEl = document.getElementById('new-item-name');
            const catEl = document.getElementById('new-item-cat');
            const priceEl = document.getElementById('new-item-price');
            const imageEl = document.getElementById('new-item-image');
            
            const name = nameEl.value.trim();
            const category = catEl.value.trim() || 'General';
            const price = parseFloat(priceEl.value);
            
            if (!name || isNaN(price)) {
                if (window.showToast) window.showToast('Please provide a valid name and price.', 'error');
                return;
            }

            // Handle image upload and resize
            let base64Image = null;
            if (imageEl.files && imageEl.files[0]) {
                try {
                    base64Image = await new Promise((resolve, reject) => {
                        const file = imageEl.files[0];
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = (e) => {
                            const img = new Image();
                            img.src = e.target.result;
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 400; // Small size for Firestore
                                const scaleSize = MAX_WIDTH / img.width;
                                canvas.width = MAX_WIDTH;
                                canvas.height = img.height * scaleSize;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                resolve(canvas.toDataURL('image/jpeg', 0.8)); // 80% quality jpeg
                            };
                            img.onerror = (err) => reject(err);
                        };
                        reader.onerror = (err) => reject(err);
                    });
                } catch (e) {
                    console.error("Image processing error", e);
                    if (window.showToast) window.showToast('Error processing image.', 'error');
                    return;
                }
            }
            
            try {
                const itemData = {
                    vendorType: vendorType,
                    name: name,
                    category: category,
                    price: price,
                    available: true,
                    createdAt: Date.now()
                };
                if (base64Image) {
                    itemData.image = base64Image;
                }
                
                await addDoc(collection(db, 'menu_items'), itemData);
                
                if (window.showToast) window.showToast('Item added successfully!', 'success');
                document.getElementById('add-item-modal').style.display = 'none';
                nameEl.value = '';
                // Don't clear category as it's a dropdown
                priceEl.value = '';
                imageEl.value = '';
            } catch (e) {
                console.error("Error adding item", e);
            }
        };

        window.switchTab = function(evt, tabName) {
            const tabPanels = document.getElementsByClassName("tab-panel");
            for (let i = 0; i < tabPanels.length; i++) {
                tabPanels[i].classList.remove("active");
            }
            const tabBtns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tabBtns.length; i++) {
                tabBtns[i].classList.remove("active");
            }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.initDashboard();
        });
    </script>
    <script type="module">
        import { db, doc, onSnapshot } from './firebase-init.js?v=2';
        
        // Listen for system broadcasts
        const broadcastRef = doc(db, 'system', 'config');
        onSnapshot(broadcastRef, (docSnap) => {
            const banner = document.getElementById('system-broadcast');
            const bannerText = document.getElementById('system-broadcast-text');
            if (docSnap.exists() && docSnap.data().broadcastMessage) {
                bannerText.innerText = docSnap.data().broadcastMessage;
                banner.style.display = 'flex';
            } else {
                banner.style.display = 'none';
            }
        });
    </script>
    <script type="module" src="script.js"></script>
    <script type="module" src="home.js"></script>
</body>
</html>
