<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xerox Center - Smart Campus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        .xerox-layout {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 20px;
            margin-top: 18px;
            align-items: start;
        }

        @media (max-width: 860px) {
            .xerox-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Drag & Drop Zone */
        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 28px 20px;
            text-align: center;
            background-color: rgba(30, 30, 36, 0.5);
            transition: all 0.25s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 240px;
        }

        .upload-zone:hover {
            border-color: var(--primary-color);
            background-color: rgba(164, 118, 245, 0.06);
            transform: translateY(-2px);
        }

        .upload-icon {
            width: 44px;
            height: 44px;
            color: var(--primary-color);
            margin-bottom: 12px;
            opacity: 0.9;
        }

        .upload-zone h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }

        .upload-zone p {
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 16px;
        }

        /* Print Settings Sidebar */
        .settings-panel {
            padding: 20px 22px;
            border-radius: 14px;
        }

        .settings-panel h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 9px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #e4e4e7;
        }

        .summary-box {
            background-color: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 18px;
            margin-bottom: 14px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }
        
        /* File Uploaded State hidden by default */
        .file-uploaded-state {
            display: none;
            width: 100%;
            text-align: left;
        }
        
        .file-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .file-item-icon {
            color: #ef4444; /* red for pdf */
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        
        .file-item-details { flex-grow: 1; }
        .file-item h4 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
        .file-item p { color: var(--text-muted); font-size: 11px; margin-bottom: 0; }
    </style>
</head>
<body class="dashboard-body">
    <!-- Header -->
    <header class="navbar">
        <div class="logo cursor-pointer" onclick="window.location.href='home.html'">
            <i data-feather="hexagon" class="text-primary"></i>
            <span>SmartCampus</span>
        </div>
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.location.href='checkout.html'">
                <i data-feather="shopping-cart"></i>
            </button>
            <div class="user-profile" style="position: relative; cursor: pointer;">
                <img src="https://ui-avatars.com/api/?name=Alex+Student&background=a476f5&color=fff" alt="User Profile" id="profile-img">
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Main Service Header -->
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px;">
            <div>
                <h1 class="gradient-text" style="font-size: 24px; font-weight: 800; margin-bottom: 4px;">Xerox & Stationery</h1>
                <p style="color: #a1a1aa; font-size: 13px;">Fast campus document printing and stationery store.</p>
            </div>
            
            <!-- Category Switcher (Xerox vs Stationery) -->
            <div class="tabs" style="display: flex; gap: 8px; background: rgba(255,255,255,0.03); padding: 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06);">
                <button class="btn btn-sm btn-primary" id="tab-btn-print" onclick="window.switchXeroxTab('print')">
                    <i data-feather="printer" style="width: 14px; height: 14px;"></i> Xerox & Printing
                </button>
                <button class="btn btn-sm btn-outline" id="tab-btn-stat" onclick="window.switchXeroxTab('stationery')">
                    <i data-feather="edit-3" style="width: 14px; height: 14px;"></i> Stationery
                </button>
            </div>
        </div>

        <!-- SECTION 1: DOCUMENT PRINTING & XEROX -->
        <section id="section-print" style="margin-bottom: 30px;">
            <div class="xerox-layout">
                <!-- Step 1: Upload Zone -->
                <input type="file" id="fileInput" style="display: none;" accept=".pdf,.docx" multiple>
                <div class="upload-zone" id="drop-zone" onclick="document.getElementById('fileInput').click()">
                    <div id="upload-prompt">
                        <i data-feather="upload-cloud" class="upload-icon"></i>
                        <h3>Drag & Drop Files Here</h3>
                        <p>Supported Formats: PDF, DOCX (Max 20MB)</p>
                        <button class="btn btn-outline btn-sm" type="button">Browse Files</button>
                    </div>
                    
                    <div class="file-uploaded-state" id="file-state">
                        <div id="file-list-container">
                            <!-- Dynamic file items will be injected here -->
                        </div>
                        <div style="text-align: center; margin-top: 14px;">
                            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">+ Add More Files</button>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Settings -->
                <div class="settings-panel glass-panel">
                    <h3>Print Settings</h3>
                    
                    <div class="form-group">
                        <label>Color Mode</label>
                        <select class="form-control" id="color-mode" onchange="window.updateCost()">
                            <option value="0.10">Black & White (₹0.10/pg)</option>
                            <option value="0.50">Color (₹0.50/pg)</option>
                        </select>
                    </div>
                    
                    <div class="form-group" style="padding: 6px 0;">
                        <label class="checkbox-group">
                            <input type="checkbox" id="double-sided" checked style="width: 16px; height: 16px; accent-color: var(--primary-color);">
                            Double-sided Printing
                        </label>
                    </div>

                    <div class="form-group">
                        <label>Copies</label>
                        <input type="number" id="copies" class="form-control" value="1" min="1" onchange="window.updateCost()" oninput="window.updateCost()">
                    </div>

                    <div class="form-group">
                        <label>Binding</label>
                        <select class="form-control" id="binding" onchange="window.updateCost()">
                            <option value="0">None</option>
                            <option value="2.00">Spiral Binding (+₹2.00)</option>
                            <option value="0.50">Staple (Top Left) (+₹0.50)</option>
                        </select>
                    </div>

                    <!-- Step 3: Summary -->
                    <div class="summary-box">
                        <div class="summary-row">
                            <span>Total Pages:</span>
                            <span id="summary-pages">0</span>
                        </div>
                        <div class="summary-row">
                            <span>Cost per page:</span>
                            <span id="summary-cost">₹0.00</span>
                        </div>
                        <div class="summary-total">
                            <span>Estimated Cost</span>
                            <span class="text-primary" id="summary-total">₹0.00</span>
                        </div>
                    </div>

                    <button class="btn btn-primary" style="width: 100%;" onclick="window.payAndAdd()">
                        Pay & Add to Queue
                    </button>
                </div>
            </div>
        </section>

        <!-- SECTION 2: STATIONERY -->
        <section id="section-stationery" style="margin-bottom: 30px; display: none;">
            <div id="stationery-grid-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px;">
                <p style="color: #a1a1aa; padding: 20px; text-align: center; grid-column: 1/-1;">Loading stationery items...</p>
            </div>
        </section>
    </main>

    <script type="module">
        import { db, collection, query, where, onSnapshot } from './firebase-init.js';

        feather.replace();

        // Switch between Xerox and Stationery
        window.switchXeroxTab = function(tab) {
            const printSec = document.getElementById('section-print');
            const statSec = document.getElementById('section-stationery');
            const btnPrint = document.getElementById('tab-btn-print');
            const btnStat = document.getElementById('tab-btn-stat');

            if (tab === 'print') {
                printSec.style.display = 'block';
                statSec.style.display = 'none';
                btnPrint.className = 'btn btn-sm btn-primary';
                btnStat.className = 'btn btn-sm btn-outline';
            } else if (tab === 'stationery') {
                printSec.style.display = 'none';
                statSec.style.display = 'block';
                btnPrint.className = 'btn btn-sm btn-outline';
                btnStat.className = 'btn btn-sm btn-primary';
            }
            if (typeof feather !== 'undefined') feather.replace();
        };
        
        // Setup PDF.js worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        const uploadPrompt = document.getElementById('upload-prompt');
        const fileState = document.getElementById('file-state');
        const fileListContainer = document.getElementById('file-list-container');
        
        let currentFiles = [];
        let totalPages = 0;

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--primary-color)';
            dropZone.style.backgroundColor = 'rgba(164, 118, 245, 0.1)';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            dropZone.style.backgroundColor = 'rgba(44, 44, 46, 0.2)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            dropZone.style.backgroundColor = 'rgba(44, 44, 46, 0.2)';
            
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
        });

        function handleFiles(files) {
            uploadPrompt.style.display = 'none';
            fileState.style.display = 'block';
            dropZone.style.borderStyle = 'solid';
            dropZone.style.borderColor = 'rgba(255,255,255,0.1)';
            
            Array.from(files).forEach(file => {
                const fileId = 'file_' + Date.now() + Math.floor(Math.random() * 1000);
                const fileObj = {
                    id: fileId,
                    file: file,
                    name: file.name,
                    sizeMB: (file.size / (1024 * 1024)).toFixed(2),
                    pages: 0,
                    status: 'Calculating...'
                };
                currentFiles.push(fileObj);
                
                const fileEl = document.createElement('div');
                fileEl.className = 'file-item';
                fileEl.id = fileId;
                fileEl.style.marginBottom = '10px';
                fileEl.innerHTML = `
                    <i data-feather="file-text" class="file-item-icon" style="width: 32px; height: 32px;"></i>
                    <div class="file-item-details" style="flex-grow: 1; text-align: left;">
                        <h4 style="margin-bottom: 5px; font-size: 15px;">${fileObj.name}</h4>
                        <p id="meta_${fileId}" style="color: #a1a1aa; font-size: 13px;">${fileObj.status} • ${fileObj.sizeMB} MB</p>
                    </div>
                    <i data-feather="trash-2" style="color: #ef4444; cursor: pointer; opacity: 0.8;" onclick="event.stopPropagation(); window.removeFile('${fileId}')" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.8'"></i>
                `;
                fileListContainer.appendChild(fileEl);
                if (typeof feather !== 'undefined') feather.replace();

                if (window.pdfjsLib && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
                    const fileReader = new FileReader();
                    fileReader.onload = function() {
                        const typedarray = new Uint8Array(this.result);
                        pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                            fileObj.pages = pdf.numPages;
                            fileObj.status = `${fileObj.pages} pages`;
                            const metaEl = document.getElementById(`meta_${fileId}`);
                            if (metaEl) metaEl.innerText = `${fileObj.status} • ${fileObj.sizeMB} MB`;
                            recalcTotalPages();
                        }).catch(err => {
                            console.error("Error parsing PDF:", err);
                            fileObj.pages = 1;
                            fileObj.status = `1 page (Error reading)`;
                            const metaEl = document.getElementById(`meta_${fileId}`);
                            if (metaEl) metaEl.innerText = `${fileObj.status} • ${fileObj.sizeMB} MB`;
                            recalcTotalPages();
                        });
                    };
                    fileReader.readAsArrayBuffer(file);
                } else {
                    fileObj.pages = 1;
                    fileObj.status = `Est. 1 page`;
                    const metaEl = document.getElementById(`meta_${fileId}`);
                    if (metaEl) metaEl.innerText = `${fileObj.status} • ${fileObj.sizeMB} MB`;
                    recalcTotalPages();
                }
            });
        }
        
        window.recalcTotalPages = function() {
            totalPages = currentFiles.reduce((sum, f) => sum + f.pages, 0);
            window.updateCost();
        }
        
        window.removeFile = function(fileId) {
            currentFiles = currentFiles.filter(f => f.id !== fileId);
            const el = document.getElementById(fileId);
            if (el) el.remove();
            
            if (currentFiles.length === 0) {
                window.resetUpload();
            } else {
                window.recalcTotalPages();
            }
        }

        window.resetUpload = function(e) {
            if(e) e.stopPropagation();
            currentFiles = [];
            fileListContainer.innerHTML = '';
            fileInput.value = '';
            uploadPrompt.style.display = 'block';
            fileState.style.display = 'none';
            dropZone.style.borderStyle = 'dashed';
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            window.updateCost();
        }
        
        window.updateCost = function() {
            if (currentFiles.length === 0) {
                document.getElementById('summary-pages').innerText = '0';
                document.getElementById('summary-cost').innerText = '₹0.00';
                document.getElementById('summary-total').innerText = '₹0.00';
                return;
            }

            const colorCost = parseFloat(document.getElementById('color-mode').value);
            const copies = parseInt(document.getElementById('copies').value) || 1;
            const bindingCost = parseFloat(document.getElementById('binding').value);
            
            const totalPagesAllCopies = totalPages * copies;
            let cost = (totalPagesAllCopies * colorCost) + (bindingCost * currentFiles.length); // Binding cost per file
            
            document.getElementById('summary-pages').innerText = totalPagesAllCopies;
            document.getElementById('summary-cost').innerText = `₹${colorCost.toFixed(2)}`;
            document.getElementById('summary-total').innerText = `₹${cost.toFixed(2)}`;
        }

        window.payAndAdd = function() {
            if (currentFiles.length === 0) {
                if (window.showToast) window.showToast("Please upload a file first!", "error");
                else alert("Please upload a file first!");
                return;
            }

            const colorCost = parseFloat(document.getElementById('color-mode').value);
            const copies = parseInt(document.getElementById('copies').value) || 1;
            const bindingCost = parseFloat(document.getElementById('binding').value);
            
            const cartItems = JSON.parse(localStorage.getItem('smartCampusCartObj')) || {};
            
            currentFiles.forEach(f => {
                const id = 'xerox_' + Date.now() + Math.floor(Math.random() * 1000);
                const fileCost = (f.pages * copies * colorCost) + bindingCost;
                cartItems[id] = {
                    name: `Print: ${f.name} (${copies}x)`,
                    price: fileCost,
                    quantity: 1
                };
            });
            
            localStorage.setItem('smartCampusCartObj', JSON.stringify(cartItems));

            window.location.href = 'checkout.html';
        };

        // Stationery Cart Management
        window.stationeryCart = JSON.parse(localStorage.getItem('smartCampusCartObj')) || {};

        window.updateStationeryItem = function(id, name, price, delta) {
            window.stationeryCart = JSON.parse(localStorage.getItem('smartCampusCartObj')) || {};
            const itemKey = 'stat_' + id;
            
            if (!window.stationeryCart[itemKey]) {
                if (delta > 0) {
                    window.stationeryCart[itemKey] = {
                        name: `${name} (Stationery)`,
                        price: parseFloat(price),
                        quantity: 1
                    };
                }
            } else {
                window.stationeryCart[itemKey].quantity += delta;
                if (window.stationeryCart[itemKey].quantity <= 0) {
                    delete window.stationeryCart[itemKey];
                }
            }
            
            localStorage.setItem('smartCampusCartObj', JSON.stringify(window.stationeryCart));
            if (window.showToast) {
                if (delta > 0) window.showToast(`Added ${name} to cart!`, 'success');
                else window.showToast(`Updated cart`, 'info');
            }
            window.renderStationeryGrid(window.allStationeryItems || []);
        };

        window.renderStationeryGrid = function(items) {
            const grid = document.getElementById('stationery-grid-container');
            if (!grid) return;
            
            if (!items || items.length === 0) {
                grid.innerHTML = '<p style="color: #a1a1aa; padding: 20px; text-align: center; grid-column: 1/-1;">No stationery items in catalog yet.</p>';
                return;
            }

            const currentCart = JSON.parse(localStorage.getItem('smartCampusCartObj')) || {};
            let html = '';

            items.forEach(item => {
                const isAvailable = item.available !== false;
                const itemKey = 'stat_' + item.docId;
                const qty = (currentCart[itemKey] && currentCart[itemKey].quantity) || 0;
                const imgUrl = item.image || 'https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80';
                
                let btnHtml = '';
                if (!isAvailable) {
                    btnHtml = `<button class="btn btn-sm btn-outline" style="width:100%; opacity: 0.5;" disabled>Out of Stock</button>`;
                } else if (qty > 0) {
                    btnHtml = `
                        <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(164, 118, 245, 0.15); border: 1px solid var(--primary-color); border-radius: 8px; padding: 4px 10px;">
                            <button class="btn-sm" style="background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; padding: 2px 8px;" onclick="window.updateStationeryItem('${item.docId}', '${item.name}', ${item.price}, -1)">-</button>
                            <span style="font-weight: 700; color: var(--primary-color); font-size: 14px;">${qty} in Cart</span>
                            <button class="btn-sm" style="background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; padding: 2px 8px;" onclick="window.updateStationeryItem('${item.docId}', '${item.name}', ${item.price}, 1)">+</button>
                        </div>
                    `;
                } else {
                    btnHtml = `
                        <button class="btn btn-sm btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;" onclick="window.updateStationeryItem('${item.docId}', '${item.name}', ${item.price}, 1)">
                            <i data-feather="plus" style="width: 14px; height: 14px;"></i> Add to Cart
                        </button>
                    `;
                }

                html += `
                    <div class="glass-panel" style="padding: 16px; border-radius: 14px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">
                        <div style="height: 120px; border-radius: 10px; background-image: url('${imgUrl}'); background-size: cover; background-position: center; margin-bottom: 12px; position: relative;">
                            <span class="status-badge ${isAvailable ? 'ready' : 'cancelled'}" style="position: absolute; top: 8px; right: 8px; font-size: 11px;">
                                ${isAvailable ? 'In Stock' : 'Out of Stock'}
                            </span>
                        </div>
                        <div>
                            <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px;">Stationery</span>
                            <h4 style="margin: 4px 0 6px 0; font-size: 16px;">${item.name}</h4>
                            <p style="font-size: 16px; font-weight: 700; color: var(--primary-color); margin-bottom: 12px;">₹${parseFloat(item.price).toFixed(2)}</p>
                        </div>
                        <div>
                            ${btnHtml}
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            if (typeof feather !== 'undefined') feather.replace();
        };

        // Fetch dynamic items from Firestore
        document.addEventListener('DOMContentLoaded', () => {
            const q = query(collection(db, 'menu_items'), where('vendorType', '==', 'xerox'));
            onSnapshot(q, (snapshot) => {
                const paperSelect = document.getElementById('color-mode');
                const bindingSelect = document.getElementById('binding');
                
                let paperHtml = '';
                let bindingHtml = '<option value="0">None</option>';
                window.allStationeryItems = [];
                
                snapshot.forEach(docSnap => {
                    const item = docSnap.data();
                    const docId = docSnap.id;
                    if (item.available === false) return;
                    
                    const cat = (item.category || '').toLowerCase();
                    const opt = `<option value="${item.price}">${item.name} (₹${parseFloat(item.price).toFixed(2)})</option>`;
                    
                    if (cat === 'paper' || cat === 'specialty' || cat === 'print') {
                        paperHtml += opt;
                    } else if (cat === 'binding') {
                        bindingHtml += opt;
                    } else if (cat === 'stationery') {
                        window.allStationeryItems.push({ ...item, docId });
                    }
                });
                
                if (paperHtml) paperSelect.innerHTML = paperHtml;
                if (bindingHtml.length > '<option value="0">None</option>'.length) {
                    bindingSelect.innerHTML = bindingHtml;
                }
                
                window.renderStationeryGrid(window.allStationeryItems);
                window.updateCost();
            });
        });
    </script>
    <script type="module" src="home.js"></script>
</body>
</html>
