<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xerox Center - Smart Campus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        .xerox-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .xerox-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Drag & Drop Zone */
        .upload-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            background-color: rgba(44, 44, 46, 0.2);
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .upload-zone:hover {
            border-color: var(--primary-color);
            background-color: rgba(164, 118, 245, 0.05);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            color: var(--primary-color);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .upload-zone h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .upload-zone p {
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        /* Print Settings Sidebar */
        .settings-panel {
            padding: 30px;
        }

        .settings-panel h3 {
            font-size: 20px;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #d1d5db;
        }

        .form-control {
            width: 100%;
            background-color: #1e1e24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .summary-box {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #9ca3af;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255,255,255,0.1);
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        
        /* File Uploaded State hidden by default */
        .file-uploaded-state {
            display: none;
            width: 100%;
            text-align: left;
        }
        
        .file-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .file-item-icon {
            color: #ef4444; /* red for pdf */
        }
        
        .file-item-details { flex-grow: 1; }
        .file-item h4 { margin-bottom: 5px; }
        .file-item p { color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body class="dashboard-body">
    <!-- Header -->
    <header class="navbar">
        <div class="logo cursor-pointer" onclick="window.location.href='home.html'">
            <i data-feather="hexagon" class="text-primary"></i>
            <span>SmartCampus</span>
        </div>
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.location.href='checkout.html'">
                <i data-feather="shopping-cart"></i>
            </button>
            <div class="user-profile" style="position: relative; cursor: pointer;">
                <img src="https://ui-avatars.com/api/?name=Alex+Student&background=a476f5&color=fff" alt="User Profile" id="profile-img">
            </div>
        </div>
    </header>

    <main class="container">
        <h1 class="gradient-text">Xerox Center</h1>
        <p style="color: #a1a1aa; margin-top: 5px;">Upload PDFs, Select Printing Options.</p>

        <div class="xerox-layout">
            <!-- Step 1: Upload Zone -->
            <input type="file" id="fileInput" style="display: none;" accept=".pdf,.docx" multiple>
            <div class="upload-zone" id="drop-zone" onclick="document.getElementById('fileInput').click()">
                <div id="upload-prompt">
                    <i data-feather="upload-cloud" class="upload-icon"></i>
                    <h3>Drag & Drop Files Here</h3>
                    <p>Supported Formats: PDF, DOCX (Max 20MB)</p>
                    <button class="btn btn-outline" type="button">Browse Files</button>
                </div>
                
                <div class="file-uploaded-state" id="file-state">
                    <div id="file-list-container">
                        <!-- Dynamic file items will be injected here -->
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); document.getElementById('fileInput').click()">+ Add More Files</button>
                    </div>
                </div>
            </div>

            <!-- Step 2: Settings -->
            <div class="settings-panel glass-panel">
                <h3>Print Settings</h3>
                
                <div class="form-group">
                    <label>Color Mode</label>
                    <select class="form-control" id="color-mode" onchange="window.updateCost()">
                        <option value="0.10">Black & White (₹0.10/pg)</option>
                        <option value="0.50">Color (₹0.50/pg)</option>
                    </select>
                </div>
                
                <div class="form-group" style="padding: 10px 0;">
                    <label class="checkbox-group">
                        <input type="checkbox" id="double-sided" checked style="width: 18px; height: 18px; accent-color: var(--primary-color);">
                        Double-sided Printing
                    </label>
                </div>

                <div class="form-group">
                    <label>Copies</label>
                    <input type="number" id="copies" class="form-control" value="1" min="1" onchange="window.updateCost()" oninput="window.updateCost()">
                </div>

                <div class="form-group">
                    <label>Binding</label>
                    <select class="form-control" id="binding" onchange="window.updateCost()">
                        <option value="0">None</option>
                        <option value="2.00">Spiral Binding (+₹2.00)</option>
                        <option value="0.50">Staple (Top Left) (+₹0.50)</option>
                    </select>
                </div>

                <!-- Step 3: Summary -->
                <div class="summary-box">
                    <div class="summary-row">
                        <span>Total Pages:</span>
                        <span id="summary-pages">0</span>
                    </div>
                    <div class="summary-row">
                        <span>Cost per page:</span>
                        <span id="summary-cost">₹0.00</span>
                    </div>
                    <div class="summary-total">
                        <span>Estimated Cost</span>
                        <span class="text-primary" id="summary-total">₹0.00</span>
                    </div>
                </div>

                <button class="btn btn-primary" style="width: 100%;" onclick="window.payAndAdd()">
                    Pay & Add to Queue
                </button>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, collection, query, where, onSnapshot } from './firebase-init.js';

        feather.replace();
        
        // Setup PDF.js worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
        
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('fileInput');
        const uploadPrompt = document.getElementById('upload-prompt');
        const fileState = document.getElementById('file-state');
        const fileListContainer = document.getElementById('file-list-container');
        
        let currentFiles = [];
        let totalPages = 0;

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'var(--primary-color)';
            dropZone.style.backgroundColor = 'rgba(164, 118, 245, 0.1)';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            dropZone.style.backgroundColor = 'rgba(44, 44, 46, 0.2)';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            dropZone.style.backgroundColor = 'rgba(44, 44, 46, 0.2)';
            
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFiles(e.target.files);
            }
        });

        function handleFiles(files) {
            uploadPrompt.style.display = 'none';
            fileState.style.display = 'block';
            dropZone.style.borderStyle = 'solid';
            dropZone.style.borderColor = 'rgba(255,255,255,0.1)';
            
            Array.from(files).forEach(file => {
                const fileId = 'file_' + Date.now() + Math.floor(Math.random() * 1000);
                const fileObj = {
                    id: fileId,
                    file: file,
                    name: file.name,
                    sizeMB: (file.size / (1024 * 1024)).toFixed(2),
                    pages: 0,
                    status: 'Calculating...'
                };
                currentFiles.push(fileObj);
                
                const fileEl = document.createElement('div');
                fileEl.className = 'file-item';
                fileEl.id = fileId;
                fileEl.style.marginBottom = '10px';
                fileEl.innerHTML = `
                    <i data-feather="file-text" class="file-item-icon" style="width: 32px; height: 32px;"></i>
                    <div class="file-item-details" style="flex-grow: 1; text-align: left;">
                        <h4 style="margin-bottom: 5px; font-size: 15px;">${fileObj.name}</h4>
                        <p id="meta_${fileId}" style="color: #a1a1aa; font-size: 13px;">${fileObj.status} • ${fileObj.sizeMB} MB</p>
                    </div>
                    <i data-feather="trash-2" style="color: #ef4444; cursor: pointer; opacity: 0.8;" onclick="event.stopPropagation(); window.removeFile('${fileId}')" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.8'"></i>
                `;
                fileListContainer.appendChild(fileEl);
                if (typeof feather !== 'undefined') feather.replace();

                if (window.pdfjsLib && (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
                    const fileReader = new FileReader();
                    fileReader.onload = function() {
                        const typedarray = new Uint8Array(this.result);
                        pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                            fileObj.pages = pdf.numPages;
                            fileObj.status = `${fileObj.pages} pages`;
                            const metaEl = document.getElementById(`meta_${fileId}`);
                            if (metaEl) metaEl.innerText = `${fileObj.status} • ${fileObj.sizeMB} MB`;
                            recalcTotalPages();
                        }).catch(err => {
                            console.error("Error parsing PDF:", err);
                            fileObj.pages = 1;
                            fileObj.status = `1 page (Error reading)`;
                            const metaEl = document.getElementById(`meta_${fileId}`);
                            if (metaEl) metaEl.innerText = `${fileObj.status} • ${fileObj.sizeMB} MB`;
                            recalcTotalPages();
                        });
                    };
                    fileReader.readAsArrayBuffer(file);
                } else {
                    fileObj.pages = 1;
                    fileObj.status = `Est. 1 page`;
                    const metaEl = document.getElementById(`meta_${fileId}`);
                    if (metaEl) metaEl.innerText = `${fileObj.status} • ${fileObj.sizeMB} MB`;
                    recalcTotalPages();
                }
            });
        }
        
        window.recalcTotalPages = function() {
            totalPages = currentFiles.reduce((sum, f) => sum + f.pages, 0);
            window.updateCost();
        }
        
        window.removeFile = function(fileId) {
            currentFiles = currentFiles.filter(f => f.id !== fileId);
            const el = document.getElementById(fileId);
            if (el) el.remove();
            
            if (currentFiles.length === 0) {
                window.resetUpload();
            } else {
                window.recalcTotalPages();
            }
        }

        window.resetUpload = function(e) {
            if(e) e.stopPropagation();
            currentFiles = [];
            fileListContainer.innerHTML = '';
            fileInput.value = '';
            uploadPrompt.style.display = 'block';
            fileState.style.display = 'none';
            dropZone.style.borderStyle = 'dashed';
            dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            window.updateCost();
        }
        
        window.updateCost = function() {
            if (currentFiles.length === 0) {
                document.getElementById('summary-pages').innerText = '0';
                document.getElementById('summary-cost').innerText = '₹0.00';
                document.getElementById('summary-total').innerText = '₹0.00';
                return;
            }

            const colorCost = parseFloat(document.getElementById('color-mode').value);
            const copies = parseInt(document.getElementById('copies').value) || 1;
            const bindingCost = parseFloat(document.getElementById('binding').value);
            
            const totalPagesAllCopies = totalPages * copies;
            let cost = (totalPagesAllCopies * colorCost) + (bindingCost * currentFiles.length); // Binding cost per file
            
            document.getElementById('summary-pages').innerText = totalPagesAllCopies;
            document.getElementById('summary-cost').innerText = `₹${colorCost.toFixed(2)}`;
            document.getElementById('summary-total').innerText = `₹${cost.toFixed(2)}`;
        }

        window.payAndAdd = function() {
            if (currentFiles.length === 0) {
                if (window.showToast) window.showToast("Please upload a file first!", "error");
                else alert("Please upload a file first!");
                return;
            }

            const colorCost = parseFloat(document.getElementById('color-mode').value);
            const copies = parseInt(document.getElementById('copies').value) || 1;
            const bindingCost = parseFloat(document.getElementById('binding').value);
            
            const cartItems = JSON.parse(localStorage.getItem('smartCampusCartObj')) || {};
            
            currentFiles.forEach(f => {
                const id = 'xerox_' + Date.now() + Math.floor(Math.random() * 1000);
                const fileCost = (f.pages * copies * colorCost) + bindingCost;
                cartItems[id] = {
                    name: `Print: ${f.name} (${copies}x)`,
                    price: fileCost,
                    quantity: 1
                };
            });
            
            localStorage.setItem('smartCampusCartObj', JSON.stringify(cartItems));

            window.location.href = 'checkout.html';
        }

        // Fetch dynamic items from Firestore
        document.addEventListener('DOMContentLoaded', () => {
            const q = query(collection(db, 'menu_items'), where('vendorType', '==', 'xerox'));
            onSnapshot(q, (snapshot) => {
                const paperSelect = document.getElementById('color-mode');
                const bindingSelect = document.getElementById('binding');
                
                let paperHtml = '';
                let bindingHtml = '<option value="0">None</option>';
                
                snapshot.forEach(docSnap => {
                    const item = docSnap.data();
                    if (item.available === false) return; // Skip unavailable items
                    
                    const cat = item.category.toLowerCase();
                    const opt = `<option value="${item.price}">${item.name} (₹${parseFloat(item.price).toFixed(2)})</option>`;
                    
                    if (cat === 'paper' || cat === 'specialty' || cat === 'stationery') {
                        paperHtml += opt;
                    } else if (cat === 'binding') {
                        bindingHtml += opt;
                    }
                });
                
                if (paperHtml) paperSelect.innerHTML = paperHtml;
                if (bindingHtml.length > '<option value="0">None</option>'.length) {
                    bindingSelect.innerHTML = bindingHtml;
                }
                
                window.updateCost();
            });
        });
    </script>
    <script type="module" src="script.js"></script>
    <script type="module" src="home.js"></script>
</body>
</html>
