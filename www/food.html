<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Stalls - Smart Campus</title>
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="stylesheet" href="food.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="dashboard-body">
    <!-- Header -->
    <header class="navbar">
        <div class="logo cursor-pointer" onclick="window.location.href='home.html'">
            <i data-feather="hexagon" class="text-primary"></i>
            <span>SmartCampus</span>
        </div>
        <div class="search-bar">
            <i data-feather="search"></i>
            <input type="text" placeholder="Search burgers, drinks...">
        </div>
        <div class="nav-actions">
            <button class="icon-btn" onclick="window.location.href='checkout.html'">
                <i data-feather="shopping-cart"></i>
                <span class="badge">1</span>
            </button>
            <div class="user-profile" style="position: relative; cursor: pointer;">
                <img src="https://ui-avatars.com/api/?name=Alex+Student&background=a476f5&color=fff" alt="User Profile" id="profile-img">
            </div>
        </div>
    </header>

    <main class="page-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <h3>Categories</h3>
            </div>
            <ul class="cat-list">
                <li class="active" data-category="popular">
                    <i data-feather="star"></i> Popular
                </li>
                <li data-category="beverages">
                    <i data-feather="coffee"></i> Beverages
                </li>
                <li data-category="meals">
                    <i data-feather="box"></i> Meals
                </li>
                <li data-category="snacks">
                    <i data-feather="circle"></i> Snacks
                </li>
                <li data-category="breakfast">
                    <i data-feather="sun"></i> Breakfast
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <section class="main-content">
            <div class="page-header">
                <h1 class="gradient-text">Food Stalls</h1>
                <p>Order from the main canteen.</p>
            </div>

            <div class="food-grid" id="food-grid-container">
                <!-- Dynamic food items will load here from Firestore -->
                <p style="color: #a1a1aa; grid-column: 1/-1; text-align: center; padding: 40px;">Loading menu items...</p>
            </div>
        </section>

        <!-- Floating Cart (visible only on mobile or as sticky footer) -->
        <div class="floating-cart glass-panel" onclick="window.location.href='checkout.html'">
            <div class="cart-left">
                <div class="cart-icon-wrapper">
                    <i data-feather="shopping-bag"></i>
                    <span class="cart-count">1</span>
                </div>
                <div>
                    <span class="cart-total">₹4.50</span>
                </div>
            </div>
            <button class="btn btn-primary">Checkout <i data-feather="chevron-right"></i></button>
        </div>
    </main>

    <script type="module">
        import { db, collection, query, where, onSnapshot } from "./firebase-init.js";
        
        window.feather = feather;
        
        window.cartItems = JSON.parse(localStorage.getItem('smartCampusCartObj')) || {};
        window.allFoodItems = [];

        window.updateCartUI = function() {
            let count = 0;
            let total = 0;
            for (let id in window.cartItems) {
                count += window.cartItems[id].quantity;
                total += window.cartItems[id].price * window.cartItems[id].quantity;
            }
            
            const badge = document.querySelector('.nav-actions .badge');
            if (badge) badge.innerText = count;
            
            const floatCount = document.querySelector('.cart-count');
            const floatTotal = document.querySelector('.cart-total');
            if (floatCount) floatCount.innerText = count;
            if (floatTotal) floatTotal.innerText = `₹${total.toFixed(2)}`;
            
            window.renderButtons();
        };

        window.renderButtons = function() {
            document.querySelectorAll('.card-action-area').forEach(area => {
                const id = area.getAttribute('data-id');
                const isAvailable = area.getAttribute('data-available') === 'true';
                
                if (!isAvailable) {
                    area.innerHTML = `
                        <button class="btn btn-secondary" disabled style="width: 100%;">
                            Sold Out
                        </button>
                    `;
                    return;
                }

                const name = area.getAttribute('data-name');
                const price = parseFloat(area.getAttribute('data-price'));
                const vendorId = area.getAttribute('data-vendor-id') || '';
                const vendorName = area.getAttribute('data-vendor-name') || '';
                
                if (window.cartItems[id] && window.cartItems[id].quantity > 0) {
                    area.innerHTML = `
                        <div class="quantity-control">
                            <button onclick="window.updateQuantity('${id}', -1, '${name}', ${price}, '${vendorId}', '${vendorName}')"><i data-feather="minus"></i></button>
                            <span>${window.cartItems[id].quantity}</span>
                            <button onclick="window.updateQuantity('${id}', 1, '${name}', ${price}, '${vendorId}', '${vendorName}')"><i data-feather="plus"></i></button>
                        </div>
                    `;
                } else {
                    area.innerHTML = `
                        <button class="btn btn-primary add-to-cart-btn" onclick="window.updateQuantity('${id}', 1, '${name}', ${price}, '${vendorId}', '${vendorName}')" style="width: 100%;">
                            <i data-feather="plus"></i> Add to Cart
                        </button>
                    `;
                }
            });
            if (typeof feather !== 'undefined') feather.replace();
        };

        window.updateQuantity = function(id, delta, name = '', price = 0, vendorId = '', vendorName = '') {
            if (!window.cartItems[id]) {
                if (delta > 0) {
                    window.cartItems[id] = { name, price, quantity: 1, vendorId, vendorName };
                }
            } else {
                window.cartItems[id].quantity += delta;
                if (vendorId) window.cartItems[id].vendorId = vendorId;
                if (vendorName) window.cartItems[id].vendorName = vendorName;
                if (window.cartItems[id].quantity <= 0) {
                    delete window.cartItems[id];
                }
            }
            localStorage.setItem('smartCampusCartObj', JSON.stringify(window.cartItems));
            window.updateCartUI();
        };

        function renderFoodGrid() {
            const grid = document.getElementById('food-grid-container');
            const activeCategory = document.querySelector('.cat-list li.active').getAttribute('data-category');
            
            grid.innerHTML = '';
            
            let displayItems = window.allFoodItems;
            if (activeCategory !== 'all' && activeCategory !== 'popular') {
                displayItems = window.allFoodItems.filter(item => {
                    const c = (item.category || '').toLowerCase();
                    return c.includes(activeCategory) || activeCategory.includes(c);
                });
            }

            if (displayItems.length === 0) {
                grid.innerHTML = '<p style="color: #a1a1aa; grid-column: 1/-1; text-align: center; padding: 40px;">No items in this category.</p>';
                return;
            }

            displayItems.forEach(item => {
                const isAvailable = item.available !== false;
                const badgeHtml = isAvailable 
                    ? '<span class="stock-badge in-stock">Available</span>'
                    : '<span class="stock-badge out-stock">Out of Stock</span>';
                
                const imgUrl = item.image || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80';

                const vendorTitle = item.vendorName ? `<p style="font-size: 11px; color: var(--primary-color); margin: 0 0 3px 0; font-weight: 600;"><i data-feather="coffee" style="width: 11px; height: 11px; vertical-align: middle;"></i> ${item.vendorName}</p>` : '';

                grid.innerHTML += `
                    <div class="food-card" data-category="${item.category}">
                        <div class="food-img" style="background-image: url('${imgUrl}')">
                            ${badgeHtml}
                        </div>
                        <div class="food-info">
                            ${vendorTitle}
                            <h3 class="${!isAvailable ? 'disabled-text' : ''}" style="margin-top: 0;">${item.name}</h3>
                            <p class="price ${!isAvailable ? 'disabled-text' : ''}">₹${parseFloat(item.price).toFixed(2)}</p>
                            <div class="card-action-area" data-id="${item.docId}" data-name="${item.name}" data-price="${item.price}" data-vendor-id="${item.vendorId || ''}" data-vendor-name="${item.vendorName || ''}" data-available="${isAvailable}"></div>
                        </div>
                    </div>
                `;
            });
            if (typeof feather !== 'undefined') feather.replace();
            window.updateCartUI();
        }

        // Category Filtering Logic
        document.addEventListener('DOMContentLoaded', () => {
            const catItems = document.querySelectorAll('.cat-list li');

            catItems.forEach(item => {
                item.addEventListener('click', () => {
                    catItems.forEach(c => c.classList.remove('active'));
                    item.classList.add('active');
                    renderFoodGrid();
                });
            });

            // Listen to Firestore
            const q = query(collection(db, 'menu_items'), where('vendorType', '==', 'food'));
            onSnapshot(q, (snapshot) => {
                window.allFoodItems = [];
                snapshot.forEach(docSnap => {
                    window.allFoodItems.push({ ...docSnap.data(), docId: docSnap.id });
                });
                renderFoodGrid();
            });
        });
    </script>
    <script type="module" src="home.js"></script>
</body>
</html>
